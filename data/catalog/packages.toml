# Paket kataloğu.
#
# KESİN KURAL: Paket adı uydurulmaz. Bir adın kaynağı doğrulanmadıysa:
#   package = "TODO_VERIFY"
#   verification_status = "todo_verify"
# yazılır ve o giriş install planına alınmaz.
#
# Şema:
# [[packages]]
# catalog_id = "ornek.kategori.arac"
# family = "debian"            # debian | fedora | arch | opensuse | alpine | void | unknown
# manager = "apt"              # apt | dnf | pacman | zypper | apk | xbps | unknown
# package = "TODO_VERIFY"      # veya doğrulanmış gerçek paket adı
# risk = "low"                 # low | medium | high
# verification_status = "todo_verify"  # verified | todo_verify
# category_id = "basics"
# reason = "Neden önerildiğini açıklayan kısa metin."
# source = ""                  # ZORUNLU (verified için): adın doğrulandığı kaynak
#                              # (distro wiki/docs/URL). Boşsa Catalog::validate reddeder.
#
# Kural: verification_status = "verified" olan bir girişte
#   - package "TODO_VERIFY" olamaz, ve
#   - source boş bırakılamaz. Aksi halde katalog geçersiz sayılır.
#
# Kaynaklar (adlar resmi kaynaklardan doğrulandı):
#   debian   -> https://packages.debian.org/stable/  (stable suite)
#   fedora   -> https://mdapi.fedoraproject.org/f44/  (binary package)
#   arch     -> https://archlinux.org/packages/       (repo + paket sayfası)
#   opensuse -> https://download.opensuse.org/tumbleweed/repo/oss/x86_64/
#
# Not: Aynı araç farklı ailelerde farklı paket adı taşıyabilir
# (ör. fd -> Debian/Fedora "fd-find", openSUSE/Arch "fd").
# Steam gibi ek repo (multilib/RPM Fusion/non-free) gerektiren oyun araçları
# kapsam dışıdır ve kataloğa alınmaz.

