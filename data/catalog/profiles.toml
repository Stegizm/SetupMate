# Donanım/oturum profilleri.
# Bu dosya paket adı içermez; yalnızca kategori seçimini yönlendirir.
# GUI'deki "Önerilen" görünümü, eşleşen profillerin category_ids birleşimini kullanır.
# `description` sade dille yazılır; yeni başlayan kullanıcıya hangi kategoriyi
# neden önerdiğimizi açıklar.

[[profiles]]
id = "laptop"
name = "Dizüstü"
